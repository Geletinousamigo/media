name: GitHub Release with APKs

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (ex: v1.0.0)"
        required: true
        type: string
      demo_name:
        description: "Demo module"
        type: choice
        options:
          - demo
          - demo-cast
          - demo-compose
          - demo-composition
          - demo-effect
          - demo-gl
          - demo-session
          - demo-session-automotive
          - demo-shortform
          - demo-surface
          - demo-transformer
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: github.repository == 'Geletinousamigo/media'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Show demo projects
        run: |
          ./gradlew projects | grep "Project ':demo"

      - name: Build release variant generation
        run: |
          DEMO="${{ inputs.demo_name || 'demos:compose' }}"
          ./gradlew :$DEMO:assembleRelease

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          release_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: false

      - name: Upload APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
      
          find . -name "*.apk" | while read apk; do
            gh release upload "$TAG" "$apk" --clobber
          done
